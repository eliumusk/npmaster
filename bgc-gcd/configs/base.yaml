# Stage 3 base config
seed: 0
device: cuda  # auto-falls-back to cpu if unavailable

data:
  embeddings_path: /data/muskliu/np_master/data/embeddings/embeddings.npy
  labels_path: /data/muskliu/np_master/data/windows/windows_metadata.csv
  nll_path: /data/muskliu/np_master/data/embeddings/nll_features.npy
  batch_size: 256
  num_workers: 4
  input_dim: 4096

model:
  proj_hidden: 2048
  proj_out: 256
  dropout: 0.3
  dann_hidden: 128

train:
  n_epochs: 100
  lr: 0.1
  momentum: 0.9
  weight_decay: 1.0e-5
  alpha: 1.0    # classification
  beta: 0.35    # contrastive
  gamma: 0.1    # DANN
  tau: 0.07     # contrastive temperature
  dann_warmup_epochs: 20  # lambda 0 -> 1
  cross_phylum_weight: 1.5
  augmentation: true
  noise_std: 0.05
  dropout_rate: 0.1
  use_class_weight: true
  grad_clip: 10.0

log:
  print_every: 20
  debug_pair_stats_epochs: [0, 1, 5, 20]  # epochs to dump positive-pair stats
  out_dir: /data/muskliu/np_master/data/stage3_results/run
