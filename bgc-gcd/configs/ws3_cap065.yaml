# WS3 sweep: capture=0.65 (moderate relabeling, 514 windows flipped)
seed: 0
device: cuda
data:
  embeddings_path: /data/muskliu/np_master/data/embeddings/embeddings.npy
  labels_path: /data/muskliu/np_master/data/windows/windows_metadata_cap065.csv
  batch_size: 256
  num_workers: 4
  input_dim: 4096
  pos_ratio: 0.15
model:
  proj_hidden: 2048
  proj_out: 256
  dropout: 0.3
  dann_hidden: 128
train:
  n_epochs: 100
  lr: 0.1
  momentum: 0.9
  weight_decay: 1.0e-5
  alpha: 1.0
  beta: 0.35
  gamma: 0.1
  tau: 0.07
  dann_warmup_epochs: 20
  cross_phylum_weight: 1.5
  augmentation: true
  noise_std: 0.05
  dropout_rate: 0.1
  use_class_weight: true
  grad_clip: 10.0
  checkpoint_metric: bgc_binary_auroc
log:
  print_every: 20
  debug_pair_stats_epochs: [0, 1, 5, 20]
  out_dir: /data/muskliu/np_master/data/stage3_results/F_cap065
