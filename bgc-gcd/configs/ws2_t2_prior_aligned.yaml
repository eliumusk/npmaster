# WS2-T2: Retrain with deployment-realistic priors
# Same architecture as Config B (contrastive), but with pos_ratio=0.15
# to approximate real genome scanning conditions (~10-15% BGC windows).
seed: 0
device: cuda

data:
  embeddings_path: /data/muskliu/np_master/data/embeddings/embeddings.npy
  labels_path: /data/muskliu/np_master/data/windows/windows_metadata.csv
  batch_size: 256
  num_workers: 4
  input_dim: 4096
  pos_ratio: 0.15  # deployment-realistic: ~15% positive per batch

model:
  proj_hidden: 2048
  proj_out: 256
  dropout: 0.3
  dann_hidden: 128

train:
  n_epochs: 100
  lr: 0.1
  momentum: 0.9
  weight_decay: 1.0e-5
  alpha: 1.0    # classification
  beta: 0.35    # contrastive
  gamma: 0.1    # DANN
  tau: 0.07     # contrastive temperature
  dann_warmup_epochs: 20
  cross_phylum_weight: 1.5
  augmentation: true
  noise_std: 0.05
  dropout_rate: 0.1
  use_class_weight: true
  grad_clip: 10.0
  checkpoint_metric: bgc_binary_auroc  # deployment-facing: score_maxtype ranking quality

log:
  print_every: 20
  debug_pair_stats_epochs: [0, 1, 5, 20]
  out_dir: /data/muskliu/np_master/data/stage3_results/E_prior_aligned
