# Active mainline: Evo2-LR multiscale (renamed from v4.1).

name: evo2_lr_multiscale
status: formal_9genome_mainline

model:
  kind: linear_probe_multi_scale_union
  feature: evo2_7b_blocks.20.mlp.l3_meanpool_4096d
  weights: /data/muskliu/npmaster/data/evo2_lr_multiscale/lr_A1.npz

scales:
  primary:
    window: 8192
    stride: 2048
    operating_point:
      start_threshold: 0.95
      extend_threshold: 0.80
      min_support_windows: 3
      max_gap: 0
  short_rescue:
    window: 4096
    stride: 1024
    operating_point:
      start_threshold: 0.95
      extend_threshold: 0.80
      min_support_windows: 5
      max_gap: 0
    length_filter_max: 10000

fusion:
  kind: union_dedup
  iou_threshold: 0.3

metrics_9genome:
  dedup_f1: 0.4878
  dedup_f1_ci95: [0.345, 0.609]
  bench_precision: 0.5976
  bench_recall: 0.4590
  bench_f1: 0.5192
  strict_f1: 0.4299
  n_pred: 246

artifacts:
  nine_genome_readout: experiments/evo2_lr_multiscale/nine_genome_readout.json
  oer004256_learned_decoder: experiments/evo2_lr_multiscale/oer004256_learned_decoder/
  server_primary_preds: <server-primary-preds-dir>
  server_short_preds: <server-short-preds-dir>
