# Evo2-First-Principles v4.1 — FROZEN CANDIDATE (multi-scale honest ensemble)
#
# Supersedes `evo2_first_principles_v4_frozen.yaml` for reporting. v4 (single
# window-LR at w=8192) remains the simpler baseline reference.
#
# v4.1 is a 2-scale union-dedup ensemble that adds short-BGC rescue on top of
# v4, all under first-principles honest OP selection.
#
# See docs/superpowers/plans/2026-04-21-evo2-first-principles-v4.md §14
# and docs/reports/SUMMARY_FOR_USER.md (2026-04-22).

model:
  # Both scales use the same backbone + same LR weights applied at different geometries.
  kind: "linear_probe_multi_scale_union"
  feature: "evo2_7b_blocks.20.mlp.l3_meanpool_4096d"
  weights: "/data/muskliu/npmaster/experiments/evo2_first_principles/baseline_a/lr_A1.npz"

scales:
  primary:
    window: 8192
    stride: 2048
    operating_point:
      start_threshold: 0.95
      extend_threshold: 0.80
      min_support_windows: 3
      max_gap: 0
    rationale: "v4 alt OP — baseline winner; covers long BGCs (≥10 kb)"
  short_rescue:
    window: 4096
    stride: 1024
    operating_point:
      start_threshold: 0.95
      extend_threshold: 0.80
      min_support_windows: 5   # min region length = 4096 + 4*1024 = 8192 bp
      max_gap: 0
    length_filter_max: 10000   # only keep regions < 10 kb (5-10 kb BGC rescue)
    rationale: "tight OP + length ceiling — adds short BGCs the primary scale dilutes away"

fusion:
  kind: "union_dedup"
  iou_threshold: 0.3
  rationale: "simple union; resolve overlaps by keeping higher-score region"

metrics_9genome:
  # Single readout at v4.1 ensemble OP — pre-declared, no 9g tuning.
  pooled:
    dedup_f1: 0.4878
    dedup_f1_ci95: [0.345, 0.609]
    strict_f1: 0.4299
    strict_f1_ci95: [0.284, 0.564]
    bench_f1: 0.5192
    bench_precision: 0.598
    bench_recall: 0.459
    n_pred: 246
  bucket_recall:
    "<5kb":   "7/48 (0.15)"       # unchanged vs v4
    "5-10kb": "35/89 (0.39)"      # +3 vs v4's 32/89 — the new short-BGC rescue
    "10-20kb": "37/85 (0.44)"     # -1 vs v4 (displaced by new short regions)
    "20-50kb": "42/61 (0.69)"     # -1 vs v4
    ">=50kb":  "19/22 (0.86)"

baseline_v4_reference:
  dedup_f1: 0.4869
  strict_f1: 0.4190
  bench_f1: 0.5108
  n_pred: 222
  delta_vs_v4_1:
    dedup: +0.001
    strict: +0.011
    bench: +0.008

caveats:
  - "Dedup gain is within CI95 noise; strict + bench gains are outside but CIs overlap."
  - "Improvement is structural: +3 TP hits in 5-10 kb bucket via finer granularity."
  - "<5 kb bucket (n=48 GTs, 15 in GCA_000154945.1) remains at 7/48 — this is the dominant remaining weakness."
  - "To recover <5 kb would require training an LR specifically at w=2048 (~20 A800-h), not explored."
  - "All OPs were pre-declared from first principles; ms=5 at w=4096 naturally produces a min region length of 8 kb, matching short-BGC bucket; L<10 kb is a biological natural cutoff."

supersedes: "configs/experiments/evo2_first_principles_v4_frozen.yaml"

reference_comparators_same_gt:
  bgc_prophet:
    dedup_f1: 0.3911
    strict_f1: 0.3018
    bench_f1: 0.3933
  route_b_cnn_honest_w8192_alt:
    dedup_f1: 0.2698
    strict_f1: 0.1946
    bench_f1: 0.2698
    note: "same CNN backbone as defrag_v2, honest OP — v4 ceiling reference"
  defrag_v2_ms10_s099_published:
    dedup_f1: 0.4385
    strict_f1: 0.2870
    bench_f1: 0.4385
    note: "published, 9g-dev tuned; not apples-to-apples"
