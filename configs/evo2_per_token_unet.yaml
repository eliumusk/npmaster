# Active exploratory branch: Evo2 per-token U-Net.

name: evo2_per_token_unet
status: exploratory_not_formal_9genome

features:
  layer: blocks.20.mlp.l3
  projection_dim: 128
  train_window: 16384
  inference_window: 8192
  inference_stride: 2048
  latent_bp_per_token: 8

model:
  kind: unet_1d_per_token
  hidden: 64
  loss: dice_bce
  current_checkpoint_label: E10_h64_lr1e3_b32

recommended_thresholds:
  oer_recall_first: 0.3
  oer_conservative: 0.4
  default_reference: 0.5

status_note: >-
  E10/E11 threshold labels are OER/default driven, not selected from 9-genome.
  The model family has 9g-exposed Round-1 selection history, so current numbers
  are diagnostic until a pre-registered checkpoint and threshold rule is run.

