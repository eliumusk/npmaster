# Active operating point index.

evo2_lr_multiscale:
  description: formal 9-genome mainline
  config: configs/evo2_lr_multiscale.yaml
  window: 8192
  stride: 2048
  score: bgc_score
  start_threshold: 0.95
  extend_threshold: 0.80
  max_gap: 0
  length_cap: null
  min_support_windows: 3
  valley_threshold: null
  valley_min_windows: 1
  metrics:
    dedup_f1: 0.4878
    bench_precision: 0.5976
    bench_recall: 0.4590
    bench_f1: 0.5192
    strict_f1: 0.4299
    n_pred: 246

evo2_lr_learned_decoder:
  description: OER004256 metagenome handoff decoder over Evo2-LR scores
  base_config: configs/evo2_lr_multiscale.yaml
  score: bgc_score
  primary_threshold: 0.95
  short_threshold: 0.98
  short_length_cap: 10000
  iou_dedup: 0.3
  source_artifact: experiments/evo2_lr_multiscale/oer004256_learned_decoder/

evo2_per_token_unet_e10:
  description: exploratory U-Net candidate; not formal 9-genome
  config: configs/evo2_per_token_unet.yaml
  score: per_token_probability
  threshold_policy:
    0.3: oer_recall_first
    0.4: oer_conservative
    0.5: default_reference
