sweep_id: stage4_training_v1

# Stage 4 training-hyperparameter sweep. Unlike Stage 3, mining is NOT per-trial:
# all trials reuse the meta_arrays.pkl already mined by the Stage 3 winner
# (`stage3_hardneg_v1-dev-tk100-ms0-hnw4`, recall=0.5412 / precision=0.2824 /
# f1=0.3711). Only training hyperparameters vary across trials; every trial
# warm-starts from the same Stage 3 seed checkpoint and runs the same
# inference/eval tail (w8192/s2048 fused, val_frozen_fused operating point).
#
# One-axis-at-a-time design (16 trials):
#   * LR scale     — vary lr_proj / lr_context / lr_classifier together (×0.1, ×0.3, ×3, ×10)
#   * Weight decay — wd ∈ {0, 1e-5, 1e-3, 1e-2}
#   * Warmup       — warmup_epochs ∈ {0, 10, 15, 20}
#   * Dropout      — proj_dropout ∈ {0.0, 0.5}, cnn_dropout ∈ {0.2, 0.3}
#
# The default cell (Stage 3 best: hnw4 + train.py defaults) is intentionally
# excluded — Stage 3 tk100-ms0-hnw4 already covers it. Each trial overrides
# ONLY the knobs being swept; every other hyperparameter falls back to the
# train.py default at src/train.py:347-356.
#
# Flag surfaces verified against:
#   src/train.py:335-357               (argparse)
#   scripts/inference_stride.py:77-92  (argparse)
#   scripts/evaluate_nine_genome.py:358-388 (argparse)
defaults:
  # --- warm start (Stage 3 best seed) ---
  base_checkpoint: /data/muskliu/npmaster/data/stage3_results/H_hardneg_r10/best_H_hardneg_r10.pt

  # --- pre-mined Stage 3 winner meta_arrays (NO per-trial mining) ---
  meta_arrays_path: /data/muskliu/npmaster_exec/snapshots/f66bdc8d4ce01ab0ec545ffce3043eb5a1d5b166-dirty-gpuenvfix1/repo/experiments/stage3_hardneg_v1-dev-tk100-ms0-hnw4/artifacts/mining/meta_arrays.pkl

  # --- inputs reused across trials ---
  chunk_index: /data/muskliu/npmaster/data/phase3/route_b/chunk_index.pkl
  contig_index: /data/muskliu/npmaster/data/phase3/route_a/contig_index.pkl
  embeddings: /data/muskliu/npmaster/data/embeddings/edge_padding/embeddings_merged.npy
  projections: /data/muskliu/npmaster/data/phase3/route_a/projections_256.npy
  bgc_csv: /data/muskliu/npmaster/data/bgc_annotations.csv

  # --- training hyperparams shared by all trials ---
  hard_neg_weight: 4.0   # Stage 3 best
  seed: 0
  epochs: 100
  batch_size: 64

  # --- eval / tiling (matches Stage 2 top tiling w8192/s2048 fused) ---
  benchmark_base: /data/syh/benchmark/nine_genome
  fna_dir: /data/syh/benchmark/nine_genome/fna
  src_dir: src
  operating_point: val_frozen_fused
  window: 8192
  stride: 2048
  layer: blocks.20.mlp.l3
  evo_model: evo2_7b
  cache_dir: /data/public_models/hub

  # --- server (per-trial override possible at launch time) ---
  server: voc_gpu_node7_a800

# Trials: 16 cells, one-axis-at-a-time. Each lists ONLY the overridden knobs;
# everything else falls back to the train.py default (src/train.py:347-356).
trials:
  # --- LR scale (vary all 3 LRs together) ---
  lr-x0p1:
    lr_proj: 1.0e-5
    lr_context: 1.0e-4
    lr_classifier: 1.0e-4
  lr-x0p3:
    lr_proj: 3.0e-5
    lr_context: 3.0e-4
    lr_classifier: 3.0e-4
  lr-x3p0:
    lr_proj: 3.0e-4
    lr_context: 3.0e-3
    lr_classifier: 3.0e-3
  lr-x10p0:
    lr_proj: 1.0e-3
    lr_context: 1.0e-2
    lr_classifier: 1.0e-2

  # --- weight decay ---
  wd-0:
    wd: 0.0
  wd-1em5:
    wd: 1.0e-5
  wd-1em3:
    wd: 1.0e-3
  wd-1em2:
    wd: 1.0e-2

  # --- warmup epochs ---
  warm-0:
    warmup_epochs: 0
  warm-10:
    warmup_epochs: 10
  warm-15:
    warmup_epochs: 15
  warm-20:
    warmup_epochs: 20

  # --- dropout (proj_dropout and cnn_dropout, separate axes) ---
  pdrop-0p0:
    proj_dropout: 0.0
  pdrop-0p5:
    proj_dropout: 0.5
  cdrop-0p2:
    cnn_dropout: 0.2
  cdrop-0p3:
    cnn_dropout: 0.3
