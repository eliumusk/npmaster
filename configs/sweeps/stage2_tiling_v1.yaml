# Consolidated from original stage2_tiling_v1.yaml (3 trials, node7),
# stage2_tiling_v1_extra.yaml (5 trials, node7), and
# stage2_tiling_v1_node8.yaml (8 trials, node8).
# Per-trial `server` overrides the defaults.server for trials launched on node8.
trials:
  # --- original stage2_tiling_v1.yaml (node7, inherit default) ---
  - window: 16384
    stride: 16384
  - window: 16384
    stride: 8192
  - window: 12288
    stride: 4096
  # --- original stage2_tiling_v1_extra.yaml (node7, inherit default) ---
  - window: 8192
    stride: 8192
  - window: 8192
    stride: 4096
  - window: 12288
    stride: 6144
  - window: 24576
    stride: 12288
  - window: 24576
    stride: 24576
  # --- original stage2_tiling_v1_node8.yaml (node8, per-trial override) ---
  - window: 16384
    stride: 4096
    server: voc_gpu_node8_a800
  - window: 24576
    stride: 6144
    server: voc_gpu_node8_a800
  - window: 12288
    stride: 3072
    server: voc_gpu_node8_a800
  - window: 8192
    stride: 2048
    server: voc_gpu_node8_a800
  - window: 16384
