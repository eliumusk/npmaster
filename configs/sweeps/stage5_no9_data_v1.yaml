sweep_id: stage5_no9_data_v1

# Stage 5 label-variant sweep. Each trial:
#   (0) runs the leakage checker against its own command-line artefacts
#   (1) builds a Stage 5 labelled CSV from windows_metadata_hardneg.csv
#   (2) patches the base meta_arrays.pkl with the new labels/weights
#   (3) trains from the Stage 3 hard-neg warm-start with the new meta
#
# No 9-genome inference / eval is included — Stage 5 selection uses only
# train.py's internal val log (val split = 169 genomes, antiSMASH labels
# under the new variant's tight threshold). Final 9-genome evaluation
# is invoked separately after freezing winners per
# docs/stage5-no-nine-genome-tuning.md §1.2.

defaults:
  # Source labels (windows CSV) + base meta arrays — all server paths.
  input_windows_csv: /data/muskliu/npmaster/data/stage4_results/p2_t2_hard_neg/windows_metadata_hardneg.csv
  base_meta_arrays: /data/muskliu/npmaster/data/phase3/route_a/meta_arrays.pkl
  bgc_csv: /data/muskliu/npmaster/data/bgc_annotations.csv
  embargo_config: configs/splits/nine_genome_embargo_v1.json

  # Warm-start + static training inputs (same as Stage 4).
  base_checkpoint: /data/muskliu/npmaster/data/stage3_results/H_hardneg_r10/best_H_hardneg_r10.pt
  chunk_index: /data/muskliu/npmaster/data/phase3/route_b/chunk_index.pkl
  contig_index: /data/muskliu/npmaster/data/phase3/route_a/contig_index.pkl
  embeddings: /data/muskliu/npmaster/data/embeddings/edge_padding/embeddings_merged.npy
  projections: /data/muskliu/npmaster/data/phase3/route_a/projections_256.npy

  # Training hyperparams — same as Stage 4 winner cell unless overridden
  # per trial.
  hard_neg_weight: 4.0
  seed: 0
  epochs: 60
  batch_size: 64

  # Per-trial output root on server: experiment_dir/artifacts/inputs/{meta,csv}
  stage5_data_root: /data/muskliu/npmaster/data/stage5/no9_labels

# Trials — rungs 0/1/2 from docs/stage5-data-audit.md §5.
trials:
  baseline_v1:
    variant: baseline_v1
  tight_pos_075_v1:
    variant: tight_pos_075_v1
  tight_pos_090_v1:
    variant: tight_pos_090_v1
  truncated_exclude_v1:
    variant: truncated_exclude_v1
  short_bgc_upweight_v1:
    variant: short_bgc_upweight_v1
    short_max_bp: 10000
    short_weight: 4.0
  hardpos_hardneg_v2:
    variant: hardpos_hardneg_v2
    short_max_bp: 10000
    short_weight: 4.0
    hardneg_weight: 4.0
